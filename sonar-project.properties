# SonarQube project configuration for CIS Deployment
sonar.projectKey=cis-deployment
sonar.projectName=CIS Deployment
sonar.projectVersion=1.0

# Source roots (deployment repo - configs, scripts, Dockerfiles, limited Java)
sonar.sources=CIS-Deployment
sonar.sourceEncoding=UTF-8

# Exclude binaries, built frontend, logs, and vendor files from analysis
sonar.exclusions=\
**/*.jar,\
**/*.class,\
**/*.js,\
**/*.css,\
**/*.map,\
**/*.woff,\
**/*.woff2,\
**/*.ttf,\
**/*.eot,\
**/*.svg,\
**/*.ico,\
**/*.data,\
**/nginx/cisFrontend/**,\
**/cisFrontend/**,\
**/nginx/logs/**,\
**/logs/**,\
**/driverJarsDump/**,\
**/ICU Charting Dump/**

# Include Dockerfiles and shell scripts explicitly
sonar.inclusions=\
**/*.java,\
**/*.properties,\
**/*.conf,\
**/*.sh,\
**/*.bat,\
**/*.xml,\
**/*.yml,\
**/*.yaml,\
**/Dockerfile*,\
docker-compose.yml

# Java settings (for deviceSimulation Java files)
sonar.java.binaries=CIS-Deployment/deviceSimulation

# Quality gate is enforced in Jenkins via waitForQualityGate
